name: Repair Inventory build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair App.tsx syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/electronics-inventory/src/App.tsx')
          s = p.read_text()
          old = ": [...prev,{productId:p.id,quantity:1]);"
          new = ": [...prev,{productId:p.id,quantity:1}]);"
          if old not in s:
              raise SystemExit('Expected syntax marker was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/electronics-inventory/src/App.tsx
          git rm .github/workflows/repair-app-build.yml
          git commit -m "Fix dashboard build syntax"
          git push
