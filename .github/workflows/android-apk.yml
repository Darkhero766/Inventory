name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/electronics-inventory/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app for Capacitor
        run: pnpm --filter @workspace/electronics-inventory build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Install Capacitor wrapper
        working-directory: mobile
        run: npm install

      - name: Create Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Inventory Android v${{ github.run_number }}
          generate_release_notes: true
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
